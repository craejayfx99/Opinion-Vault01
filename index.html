<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinion Vault - Secure Portal</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.15rem; font-weight: 700; color: var(--primary); text-decoration: none; }
        .nav-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .btn { background: var(--primary); color: white; border: none; padding: 0.5rem 0.85rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600; text-decoration: none; font-size: 0.85rem; }
        .btn:hover { background: var(--primary-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger { background: var(--danger); }
        main { flex: 1; max-width: 1000px; width: 100%; margin: 1.5rem auto; padding: 0 1rem; }
        .container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.375rem; font-size: 0.85rem; color: var(--text-muted); }
        input, select, textarea { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid var(--border); border-radius: 0.375rem; color: white; font-size: 1rem; }
        .offers-grid { display: grid; grid-template-columns: 1fr; gap: 1.25rem; margin-top: 1rem; }
        @media(min-width: 640px) { .offers-grid { grid-template-columns: repeat(2, 1fr); } }
        .offer-card { border: 1px solid var(--border); border-radius: 0.5rem; overflow: hidden; background: var(--card-bg); display: flex; flex-direction: column; justify-content: space-between; }
        .offer-image { width: 100%; height: 160px; object-fit: cover; background: #0f172a; }
        .offer-content { padding: 1.25rem; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .offer-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem; }
        .offer-title { font-size: 1.05rem; font-weight: 700; }
        .offer-payout { background: rgba(34, 197, 94, 0.1); color: var(--success); padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-weight: 700; font-size: 0.85rem; }
        .offer-meta { font-size: 0.85rem; color: var(--text-muted); margin: 0.75rem 0; display: flex; flex-direction: column; gap: 0.25rem; }
        .hidden { display: none !important; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
        th, td { padding: 0.65rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #0f172a; color: var(--text-muted); }
        .badge { padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.7rem; font-weight: 600; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-paused { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem; }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">Opinion Vault</a>
        <div class="nav-actions">
            <a id="game-btn" href="#" target="_blank" class="btn btn-outline hidden">🎮 Game</a>
            <button class="btn btn-outline" onclick="openContactModal()">Support</button>
            <button id="nav-admin-btn" class="btn btn-outline" onclick="showAdminLogin()">Admin</button>
            <button id="nav-logout-btn" class="btn btn-danger hidden" onclick="adminLogout()">Logout</button>
        </div>
    </header>

    <main>
        <section id="view-email-gate">
            <div class="container" style="max-width: 400px; margin: 3rem auto; text-align: center;">
                <h2>Unlock Offers</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.25rem;">Enter your email to access available tasks and links.</p>
                <div class="form-group" style="text-align: left;">
                    <label>Email Address</label>
                    <input type="email" id="visitor-email" placeholder="name@example.com" required>
                </div>
                <button class="btn" style="width: 100%; padding: 0.75rem;" onclick="submitVisitorEmail()">Unlock Portal</button>
            </div>
        </section>

        <section id="view-user" class="hidden">
            <div class="toolbar">
                <div>
                    <h2>Available Offers</h2>
                    <p style="color: var(--text-muted); font-size: 0.85rem;">Complete tasks below.</p>
                </div>
                <div>
                    <input type="text" id="search-offers" placeholder="Search..." oninput="renderUserOffers()" style="padding: 0.4rem; width: 140px; font-size: 0.85rem;">
                </div>
            </div>
            <div id="user-offers-container" class="offers-grid"></div>
        </section>

        <section id="view-admin-login" class="hidden">
            <div class="container" style="max-width: 380px; margin: 3rem auto;">
                <h2>Admin Login</h2>
                <div class="form-group" style="margin-top: 1rem;">
                    <label>Passcode</label>
                    <input type="password" id="admin-pass-input" placeholder="Passcode (default 1234)">
                </div>
                <button class="btn" style="width: 100%;" onclick="verifyAdminLogin()">Login</button>
            </div>
        </section>

        <section id="view-admin-dashboard" class="hidden">
            <div class="toolbar">
                <h2>Dashboard</h2>
                <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <button class="btn" onclick="openOfferModal()">+ Add Offer</button>
                    <button class="btn btn-outline" onclick="openSettingsModal()">⚙️ Settings</button>
                </div>
            </div>

            <div class="container">
                <h3>Manage Offers</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Img</th>
                                <th>Title</th>
                                <th>Payout</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-offers-table"></tbody>
                    </table>
                </div>
            </div>

            <div class="container">
                <h3>Captured Emails</h3>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="admin-emails-table"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div id="offer-modal" class="hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:1000; padding: 1rem;">
        <div class="container" style="width: 100%; max-width: 455px; max-height: 85vh; overflow-y: auto; margin:0;">
            <h3 id="modal-title-text">Offer Details</h3>
            <input type="hidden" id="edit-offer-id">
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="field-title" placeholder="Offer Title">
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="field-desc" rows="2" placeholder="Description"></textarea>
            </div>
            <div class="form-group">
                <label>Cover Image URL</label>
                <input type="url" id="field-image" placeholder="https://image-link.com">
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="field-category" placeholder="Surveys, Apps, etc.">
            </div>
            <div class="form-group">
                <label>Payout / Points</label>
                <input type="text" id="field-payout" placeholder="1100 points or $5">
            </div>
            <div class="form-group">
                <label>Country Target</label>
                <input type="text" id="field-country" placeholder="United States">
            </div>
            <div class="form-group">
                <label>Device Target</label>
                <select id="field-device">
                    <option value="All phones">All phones</option>
                    <option value="iPhone">iPhone</option>
                    <option value="Android">Android</option>
                    <option value="Desktop/Laptop">Desktop/Laptop</option>
                    <option value="Tablet">Tablet</option>
                </select>
            </div>
            <div class="form-group">
                <label>Offer Link URL</label>
                <input type="url" id="field-link" placeholder="https://tracking-link.com">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="field-status">
                    <option value="Active">Active</option>
                    <option value="Paused">Paused</option>
                </select>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn btn-outline" onclick="closeOfferModal()">Cancel</button>
                <button class="btn" onclick="saveOffer()">Save Offer</button>
            </div>
        </div>
    </div>

    <div id="settings-modal" class="hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:1000; padding: 1rem;">
        <div class="container" style="width: 100%; max-width: 400px; margin:0;">
            <h3>Settings</h3>
            <div class="form-group" style="margin-top: 1rem;">
                <label>Admin Password</label>
                <input type="text" id="setting-password">
            </div>
            <div class="form-group">
                <label>Support Contact</label>
                <input type="text" id="setting-contact">
            </div>
            <div class="form-group">
                <label>Game URL</label>
                <input type="url" id="setting-game-url">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                <button class="btn btn-outline" onclick="closeSettingsModal()">Cancel</button>
                <button class="btn" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <div id="contact-modal" class="hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:1000; padding: 1rem;">
        <div class="container" style="width: 100%; max-width: 350px; margin:0;">
            <h3>Support</h3>
            <p id="contact-info-display" style="margin: 1rem 0; font-size: 0.9rem; word-break: break-all;"></p>
            <div style="display: flex; justify-content: flex-end;">
                <button class="btn" onclick="closeContactModal()">Close</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_SETTINGS = { password: "1234", contact: "support@opinionvault.com", gameUrl: "" };
        const DEFAULT_OFFERS = [
            { id: "1", title: "Consumer Product Survey", desc: "Share your thoughts on electronics.", image: "", category: "Surveys", payout: "1100 points", country: "United States", device: "Desktop/Laptop", link: "https://example.com", status: "Active" }
        ];

        function getSettings() { const s = localStorage.getItem('ov_settings'); return s ? JSON.parse(s) : DEFAULT_SETTINGS; }
        function saveSettingsStorage(s) { localStorage.setItem('ov_settings', JSON.stringify(s)); }
        function getOffers() { const o = localStorage.getItem('ov_offers'); return o ? JSON.parse(o) : DEFAULT_OFFERS; }
        function saveOffersStorage(o) { localStorage.setItem('ov_offers', JSON.stringify(o)); }
        function getEmails() { const e = localStorage.getItem('ov_emails'); return e ? JSON.parse(e) : []; }
        function saveEmailsStorage(e) { localStorage.setItem('ov_emails', JSON.stringify(e)); }

        let isAdminLoggedIn = false;
        window.onload = function() {
    updateGlobalUI();
    const savedCountry = localStorage.getItem('ov_selected_country');
    if (!savedCountry) {
        showView('view-country-selector');
    } else {
        checkEmailGate();
    }
};

        function checkEmailGate() {
            if (localStorage.getItem('ov_unlocked_email')) { showView('view-user'); renderUserOffers(); }
            else { showView('view-email-gate'); }
        }

        function submitVisitorEmail() {
            const email = document.getElementById('visitor-email').value.trim();
            if (!email || !email.includes('@')) { alert('Enter valid email'); return; }
            let emails = getEmails(); emails.push({ email, date: new Date().toLocaleDateString() }); saveEmailsStorage(emails);
            localStorage.setItem('ov_unlocked_email', email);
            showView('view-user'); renderUserOffers();
        }

        function updateGlobalUI() {
            const s = getSettings();
            const btn = document.getElementById('game-btn');
            if (s.gameUrl) { btn.href = s.gameUrl; btn.classList.remove('hidden'); } else { btn.classList.add('hidden'); }
        }

        function showView(id) {
            ['view-email-gate', 'view-user', 'view-admin-login', 'view-admin-dashboard'].forEach(v => document.getElementById(v).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function showAdminLogin() {
            if (isAdminLoggedIn) { showView('view-admin-dashboard'); renderAdminOffers(); renderAdminEmails(); }
            else { showView('view-admin-login'); }
        }

        function verifyAdminLogin() {
            if (document.getElementById('admin-pass-input').value === getSettings().password) {
                isAdminLoggedIn = true;
                document.getElementById('nav-admin-btn').classList.add('hidden');
                document.getElementById('nav-logout-btn').classList.remove('hidden');
                document.getElementById('admin-pass-input').value = '';
                showView('view-admin-dashboard'); renderAdminOffers(); renderAdminEmails();
            } else { alert('Incorrect password'); }
        }

        function adminLogout() {
            isAdminLoggedIn = false;
            document.getElementById('nav-admin-btn').classList.remove('hidden');
            document.getElementById('nav-logout-btn').classList.add('hidden');
            checkEmailGate();
        }

        function renderUserOffers() {
            const container = document.getElementById('user-offers-container');
            const search = document.getElementById('search-offers').value.toLowerCase();
            const offers = getOffers().filter(o => o.status === 'Active');
            container.innerHTML = '';
            const filtered = offers.filter(o => o.title.toLowerCase().includes(search) || o.category.toLowerCase().includes(search));
            if (!filtered.length) { container.innerHTML = `<p style="color:var(--text-muted)">No active offers.</p>`; return; }
            filtered.forEach(o => {
                const card = document.createElement('div');
                card.className = 'offer-card';
                card.innerHTML = `
                    <div>
                        ${o.image ? `<img src="${o.image}" class="offer-image">` : `<div style="height:100px;background:#0f172a;display:flex;align-items:center;justify-content:center;color:var(--text-muted)">No Cover Image</div>`}
                        <div class="offer-content">
                            <div>
                                <div class="offer-header">
                                    <span class="offer-title">${o.title}</span>
                                    <span class="offer-payout">${o.payout}</span>
                                </div>
                                <p style="font-size:0.85rem; color:var(--text-muted);">${o.desc}</p>
                                <div class="offer-meta">
                                    <span>Country: <strong style="color:white">${o.country}</strong></span>
                                    <span>Device: <strong style="color:white">${o.device}</strong></span>
                                    <span>Category: <strong style="color:white">${o.category}</strong></span>
                                </div>
                            </div>
                            <a href="${o.link}" target="_blank" class="btn" style="text-align:center; margin-top:0.75rem;">Open offer</a>
                        </div>
                    </div>`;
                container.appendChild(card);
            });
        }

        function renderAdminOffers() {
            const tbody = document.getElementById('admin-offers-table');
            const offers = getOffers();
            tbody.innerHTML = '';
            if (!offers.length) { tbody.innerHTML = `<tr><td colspan="5" style="text-align:center">No offers</td></tr>`; return; }
            offers.forEach(o => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${o.image ? `<img src="${o.image}" style="width:30px;height:25px;object-fit:cover;">` : 'None'}</td>
                    <td><strong>${o.title}</strong></td>
                    <td>${o.payout}</td>
                    <td><span class="badge ${o.status === 'Active' ? 'badge-active' : 'badge-paused'}">${o.status}</span></td>
                    <td>
                        <button class="btn btn-outline" style="padding:0.2rem 0.4rem; font-size:0.75rem;" onclick="openOfferModal('${o.id}')">Edit</button>
                        <button class="btn btn-danger" style="padding:0.2rem 0.4rem; font-size:0.75rem;" onclick="deleteOffer('${o.id}')">Del</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        function renderAdminEmails() {
            const tbody = document.getElementById('admin-emails-table');
            const emails = getEmails();
            tbody.innerHTML = '';
            if (!emails.length) { tbody.innerHTML = `<tr><td colspan="2" style="text-align:center">No emails</td></tr>`; return; }
            emails.forEach(i => {
                tbody.innerHTML += `<tr><td><strong>${i.email}</strong></td><td>${i.date}</td></tr>`;
            });
        }

        function openOfferModal(id = null) {
            document.getElementById('offer-modal').classList.remove('hidden');
            if (id) {
                document.getElementById('modal-title-text').innerText = 'Edit Offer';
                const o = getOffers().find(x => x.id === id);
                document.getElementById('edit-offer-id').value = o.id;
                document.getElementById('field-title').value = o.title;
                document.getElementById('field-desc').value = o.desc;
                document.getElementById('field-image').value = o.image || '';
                document.getElementById('field-category').value = o.category;
                document.getElementById('field-payout').value = o.payout;
                document.getElementById('field-country').value = o.country;
                document.getElementById('field-device').value = o.device;
                document.getElementById('field-link').value = o.link;
                document.getElementById('field-status').value = o.status;
            } else {
                document.getElementById('modal-title-text').innerText = 'Add Offer';
                document.getElementById('edit-offer-id').value = '';
                ['field-title', 'field-desc', 'field-image', 'field-category', 'field-payout', 'field-country', 'field-link'].forEach(i => document.getElementById(i).value = '');
                document.getElementById('field-device').value = 'All phones';
                document.getElementById('field-status').value = 'Active';
            }
        }

        function closeOfferModal() { document.getElementById('offer-modal').classList.add('hidden'); }

        function saveOffer() {
            const id = document.getElementById('edit-offer-id').value;
            const title = document.getElementById('field-title').value.trim();
            const link = document.getElementById('field-link').value.trim();
            if (!title || !link) { alert('Title and link are required'); return; }
            const data = {
                id: id || Date.now().toString(),
                title,
                desc: document.getElementById('field-desc').value.trim(),
                image: document.getElementById('field-image').value.trim(),
                category: document.getElementById('field-category').value.trim(),
                payout: document.getElementById('field-payout').value.trim(),
                country: document.getElementById('field-country').value.trim(),
                device: document.getElementById('field-device').value,
                link,
                status: document.getElementById('field-status').value
            };
            let offers = getOffers();
            if (id) { offers = offers.map(o => o.id === id ? data : o); } else { offers.push(data); }
            saveOffersStorage(offers);
            closeOfferModal();
            renderAdminOffers();
            renderUserOffers();
        }

        function deleteOffer(id) {
            if (confirm('Delete offer?')) {
                saveOffersStorage(getOffers().filter(o => o.id !== id));
                renderAdminOffers();
                renderUserOffers();
            }
        }

        function openSettingsModal() {
            const s = getSettings();
            document.getElementById('setting-password').value = s.password;
            document.getElementById('setting-contact').value = s.contact;
            document.getElementById('setting-game-url').value = s.gameUrl;
            document.getElementById('settings-modal').classList.remove('hidden');
        }
        function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }
        function saveSettings() {
            saveSettingsStorage({
                password: document.getElementById('setting-password').value.trim() || '1234',
                contact: document.getElementById('setting-contact').value.trim(),
                gameUrl: document.getElementById('setting-game-url').value.trim()
            });
            closeSettingsModal(); updateGlobalUI(); alert('Saved!');
        }

        function openContactModal() {
            const s = getSettings();
            document.getElementById('contact-info-display').innerText = s.contact;
            document.getElementById('contact-modal').classList.remove('hidden');
        }
        function closeContactModal() { document.getElementById('contact-modal').classList.add('hidden'); }
    </script>
</body>
</html>
